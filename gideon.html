<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GIDEON</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap');

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #020507;
    color: #bffcff;
    font-family: 'Orbitron', monospace;
    overflow: hidden;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

/* FUNDO */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
        radial-gradient(circle at center, rgba(0, 220, 255, .12), transparent 40%),
        linear-gradient(180deg, #010304, #02080b);
}

.grid {
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(rgba(0, 255, 255, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 255, .045) 1px, transparent 1px);
    background-size: 40px 40px;
    transform: perspective(500px) rotateX(60deg) scale(1.6);
    transform-origin: center bottom;
    opacity: .45;
}

.scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(255,255,255,.018) 4px
    );
    pointer-events: none;
}

/* PAINEL */

.gideon {
    position: relative;
    width: min(1100px, 94vw);
    height: min(720px, 92vh);
    border: 1px solid rgba(0, 240, 255, .45);
    background: rgba(1, 10, 13, .87);
    box-shadow:
        0 0 30px rgba(0, 220, 255, .12),
        inset 0 0 40px rgba(0, 220, 255, .05);
    backdrop-filter: blur(12px);
    display: flex;
    flex-direction: column;
}

/* CABEÇALHO */

.header {
    height: 82px;
    border-bottom: 1px solid rgba(0, 240, 255, .25);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 15px;
}

.logo-symbol {
    width: 42px;
    height: 42px;
    border: 1px solid #00eaff;
    border-radius: 50%;
    position: relative;
    box-shadow: 0 0 15px rgba(0,234,255,.35);
}

.logo-symbol::before,
.logo-symbol::after {
    content: "";
    position: absolute;
    inset: 7px;
    border: 1px solid #00eaff;
    border-radius: 50%;
}

.logo-symbol::after {
    inset: 15px;
    background: #00eaff;
    box-shadow: 0 0 12px #00eaff;
}

.logo h1 {
    font-size: 22px;
    letter-spacing: 7px;
    margin: 0;
    font-weight: 600;
}

.logo small {
    display: block;
    margin-top: 5px;
    color: #4a9fa8;
    letter-spacing: 2px;
    font-size: 8px;
}

.status {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #61e8ef;
    font-size: 10px;
    letter-spacing: 2px;
}

.status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #00ffcc;
    box-shadow: 0 0 12px #00ffcc;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    50% {
        opacity: .3;
        transform: scale(.7);
    }
}

/* CORPO */

.main {
    flex: 1;
    display: grid;
    grid-template-columns: 250px 1fr;
    min-height: 0;
}

/* LATERAL */

.sidebar {
    border-right: 1px solid rgba(0,240,255,.18);
    padding: 25px 18px;
}

.panel-title {
    color: #347e85;
    font-size: 9px;
    letter-spacing: 3px;
    margin-bottom: 18px;
}

.metric {
    margin-bottom: 22px;
}

.metric-label {
    display: flex;
    justify-content: space-between;
    font-size: 8px;
    color: #4b9da4;
    margin-bottom: 7px;
}

.metric-bar {
    height: 3px;
    background: rgba(0,240,255,.08);
    overflow: hidden;
}

.metric-fill {
    height: 100%;
    background: #00eaff;
    box-shadow: 0 0 8px #00eaff;
}

.clock {
    font-size: 20px;
    color: #d8ffff;
    letter-spacing: 3px;
    margin-top: 35px;
}

.date {
    color: #4b9da4;
    font-size: 8px;
    margin-top: 7px;
    letter-spacing: 1px;
}

/* CHAT */

.chat-area {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 30px;
    scrollbar-width: thin;
    scrollbar-color: #064c55 transparent;
}

.message {
    margin-bottom: 22px;
    max-width: 85%;
    animation: appear .3s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.message .sender {
    color: #00eaff;
    font-size: 8px;
    letter-spacing: 3px;
    margin-bottom: 7px;
}

.message.user {
    margin-left: auto;
    text-align: right;
}

.message.user .sender {
    color: #6c7d80;
}

.message-text {
    font-family: Arial, sans-serif;
    line-height: 1.6;
    font-size: 14px;
    color: #c7f8fa;
    padding: 12px 15px;
    border-left: 2px solid #00d9e8;
    background: rgba(0, 240, 255, .035);
}

.message.user .message-text {
    border-left: none;
    border-right: 2px solid #4b666a;
    color: #a7babc;
}

/* DIGITAÇÃO */

.typing {
    display: none;
    padding: 0 30px 12px;
    color: #347e85;
    font-size: 8px;
    letter-spacing: 2px;
}

.typing span {
    animation: blink 1s infinite;
}

@keyframes blink {
    50% {
        opacity: 0;
    }
}

/* INPUT */

.input-area {
    border-top: 1px solid rgba(0,240,255,.2);
    padding: 18px 22px;
    display: flex;
    gap: 10px;
}

.input-area input {
    flex: 1;
    min-width: 0;
    background: rgba(0,240,255,.025);
    border: 1px solid rgba(0,240,255,.22);
    color: #d8ffff;
    outline: none;
    padding: 13px 15px;
    font-family: 'Orbitron', monospace;
    font-size: 11px;
}

.input-area input:focus {
    border-color: #00eaff;
    box-shadow: 0 0 12px rgba(0,234,255,.08);
}

button {
    font-family: 'Orbitron', monospace;
    cursor: pointer;
}

.mic,
.send {
    width: 48px;
    border: 1px solid rgba(0,240,255,.35);
    background: rgba(0,240,255,.04);
    color: #00eaff;
    transition: .2s;
}

.mic:hover,
.send:hover {
    background: rgba(0,240,255,.12);
    box-shadow: 0 0 15px rgba(0,234,255,.15);
}

.mic.active {
    background: rgba(255,60,80,.15);
    border-color: #ff5968;
    color: #ff5968;
    box-shadow: 0 0 15px rgba(255,60,80,.2);
}

/* RODAPÉ */

.footer {
    position: absolute;
    bottom: 5px;
    right: 10px;
    color: rgba(80,150,155,.35);
    font-size: 7px;
}

/* MOBILE */

@media (max-width: 700px) {

    .gideon {
        width: 100vw;
        height: 100vh;
        border: none;
    }

    .header {
        height: 70px;
        padding: 0 18px;
    }

    .logo h1 {
        font-size: 18px;
        letter-spacing: 5px;
    }

    .sidebar {
        display: none;
    }

    .main {
        display: block;
    }

    .messages {
        padding: 22px 18px;
    }

    .input-area {
        padding: 13px;
    }

    .status {
        font-size: 8px;
    }
}
</style>
</head>

<body>

<div class="background">
    <div class="grid"></div>
    <div class="scanlines"></div>
</div>

<div class="gideon">

    <header class="header">

        <div class="logo">

            <div class="logo-symbol"></div>

            <div>
                <h1>GIDEON</h1>
                <small>GESTÃO INTEGRADA DE DADOS E OPERAÇÕES</small>
            </div>

        </div>

        <div class="status">
            <div class="status-dot"></div>
            ONLINE
        </div>

    </header>


    <main class="main">

        <aside class="sidebar">

            <div class="panel-title">SYSTEM STATUS</div>

            <div class="metric">
                <div class="metric-label">
                    <span>CORE</span>
                    <span>98%</span>
                </div>

                <div class="metric-bar">
                    <div class="metric-fill" style="width:98%"></div>
                </div>
            </div>

            <div class="metric">
                <div class="metric-label">
                    <span>MEMORY</span>
                    <span>76%</span>
                </div>

                <div class="metric-bar">
                    <div class="metric-fill" style="width:76%"></div>
                </div>
            </div>

            <div class="metric">
                <div class="metric-label">
                    <span>NETWORK</span>
                    <span>100%</span>
                </div>

                <div class="metric-bar">
                    <div class="metric-fill" style="width:100%"></div>
                </div>
            </div>

            <div class="panel-title" style="margin-top:35px">
                LOCAL TIME
            </div>

            <div class="clock" id="clock">
                00:00:00
            </div>

            <div class="date" id="date">
                --
            </div>

        </aside>


        <section class="chat-area">

            <div class="messages" id="messages">

                <div class="message">

                    <div class="sender">
                        GIDEON
                    </div>

                    <div class="message-text">
                        Sistemas online. Olá. Como posso ajudá-lo?
                    </div>

                </div>

            </div>

            <div class="typing" id="typing">
                GIDEON ESTÁ PROCESSANDO<span>...</span>
            </div>


            <div class="input-area">

                <input
                    id="input"
                    type="text"
                    placeholder="Digite um comando..."
                    autocomplete="off"
                >

                <button
                    class="mic"
                    id="mic"
                    title="Falar com a GIDEON"
                >
                    🎙
                </button>

                <button
                    class="send"
                    id="send"
                    title="Enviar"
                >
                    ➤
                </button>

            </div>

        </section>

    </main>

    <div class="footer">
        GIDEON SYSTEM // LOCAL INSTANCE
    </div>

</div>


<script>

/* =====================================
   CONFIGURAÇÕES
===================================== */

const input = document.getElementById("input");
const send = document.getElementById("send");
const mic = document.getElementById("mic");
const messages = document.getElementById("messages");
const typing = document.getElementById("typing");

let recognition = null;


/* =====================================
   RELÓGIO
===================================== */

function updateClock() {

    const now = new Date();

    const time = now.toLocaleTimeString("pt-BR", {
        hour12: false
    });

    const date = now.toLocaleDateString("pt-BR", {
        weekday: "long",
        day: "2-digit",
        month: "long",
        year: "numeric"
    });

    document.getElementById("clock").textContent = time;

    document.getElementById("date").textContent =
        date.toUpperCase();
}

setInterval(updateClock, 1000);
updateClock();


/* =====================================
   ADICIONAR MENSAGEM
===================================== */

function addMessage(sender, text, user = false) {

    const message = document.createElement("div");

    message.className =
        "message" + (user ? " user" : "");

    message.innerHTML = `
        <div class="sender">${sender}</div>
        <div class="message-text">${escapeHTML(text)}</div>
    `;

    messages.appendChild(message);

    messages.scrollTop = messages.scrollHeight;
}


/* =====================================
   SEGURANÇA DO TEXTO
===================================== */

function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* =====================================
   FALA DA GIDEON
===================================== */

function speak(text) {

    if (!("speechSynthesis" in window))
        return;

    window.speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = "pt-BR";
    utterance.rate = 0.92;
    utterance.pitch = 0.85;
    utterance.volume = 1;

    window.speechSynthesis.speak(utterance);
}


/* =====================================
   PROCESSAMENTO
===================================== */

function processCommand(command) {

    const text = command
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");


    /* SAUDAÇÕES */

    if (
        text.includes("ola") ||
        text.includes("oi") ||
        text.includes("hello")
    ) {

        return "Olá. Sistemas funcionando normalmente. Estou pronta para receber seu comando.";
    }


    /* QUEM É VOCÊ */

    if (
        text.includes("quem e voce") ||
        text.includes("quem é voce") ||
        text.includes("quem e a gideon")
    ) {

        return "Eu sou a GIDEON, sua interface pessoal de gerenciamento e assistência.";
    }


    /* HORA */

    if (
        text.includes("que horas") ||
        text.includes("hora atual") ||
        text === "hora"
    ) {

        return `A hora atual é ${new Date().toLocaleTimeString("pt-BR")}.`;
    }


    /* DATA */

    if (
        text.includes("que dia") ||
        text.includes("data de hoje") ||
        text === "data"
    ) {

        return `Hoje é ${new Date().toLocaleDateString("pt-BR", {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        })}.`;
    }


    /* STATUS */

    if (
        text.includes("status") ||
        text.includes("sistemas")
    ) {

        return "Todos os sistemas principais estão operacionais. Núcleo em 98 por cento. Rede estável.";
    }


    /* GOOGLE */

    if (text.startsWith("pesquise ")) {

        const query = command.substring(9).trim();

        if (query) {

            window.open(
                "https://www.google.com/search?q=" +
                encodeURIComponent(query),
                "_blank"
            );

            return `Pesquisa iniciada para: ${query}.`;
        }
    }


    /* YOUTUBE */

    if (
        text.includes("abra o youtube") ||
        text.includes("abrir youtube")
    ) {

        window.open(
            "https://www.youtube.com",
            "_blank"
        );

        return "Abrindo o YouTube.";
    }


    /* GOOGLE */

    if (
        text.includes("abra o google") ||
        text.includes("abrir google")
    ) {

        window.open(
            "https://www.google.com",
            "_blank"
        );

        return "Abrindo o Google.";
    }


    /* BEYONCÉ 👑 */

    if (
        text.includes("beyonce") ||
        text.includes("beyonce")
    ) {

        return "Beyoncé Giselle Knowles-Carter. Artista, compositora, performer e uma ameaça permanente à estabilidade emocional do planeta.";
    }


    /* FLASH */

    if (
        text.includes("flash") ||
        text.includes("barry allen")
    ) {

        return "Barry Allen. Velocista. Investigador forense. E, considerando o número de vezes que ele altera a linha do tempo, um sério problema administrativo.";
    }


    /* PIADA */

    if (
        text.includes("conte uma piada") ||
        text.includes("me faça rir") ||
        text.includes("piada")
    ) {

        return "Por que o computador foi ao médico? Porque estava com um vírus. Diagnóstico extremamente previsível, mas funcional.";
    }


    /* AJUDA */

    if (
        text.includes("ajuda") ||
        text.includes("comandos")
    ) {

        return "Comandos disponíveis: perguntar a hora, perguntar a data, verificar o status, pesquisar algo, abrir o Google, abrir o YouTube, perguntar quem eu sou ou conversar comigo.";
    }


    /* RESPOSTA PADRÃO */

    return "Comando recebido. Ainda estou aprendendo a processar esse tipo de solicitação. Minha versão atual possui respostas locais e comandos básicos.";
}


/* =====================================
   ENVIAR
===================================== */

async function sendMessage() {

    const command = input.value.trim();

    if (!command)
        return;

    addMessage("VOCÊ", command, true);

    input.value = "";

    typing.style.display = "block";

    await new Promise(resolve =>
        setTimeout(resolve, 500)
    );

    const response =
        processCommand(command);

    typing.style.display = "none";

    addMessage("GIDEON", response);

    speak(response);
}


/* =====================================
   BOTÃO ENVIAR
===================================== */

send.addEventListener(
    "click",
    sendMessage
);


/* =====================================
   ENTER
===================================== */

input.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();
        }
    }
);


/* =====================================
   RECONHECIMENTO DE VOZ
===================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.lang = "pt-BR";

    recognition.continuous = false;

    recognition.interimResults = false;


    recognition.onstart = () => {

        mic.classList.add("active");

        mic.textContent = "⏹";
    };


    recognition.onend = () => {

        mic.classList.remove("active");

        mic.textContent = "🎙";
    };


    recognition.onresult = event => {

        const transcript =
            event.results[0][0].transcript;

        input.value = transcript;

        sendMessage();
    };


    recognition.onerror = () => {

        mic.classList.remove("active");

        mic.textContent = "🎙";
    };


    mic.addEventListener(
        "click",
        () => {

            try {

                recognition.start();

            } catch (error) {

                recognition.stop();
            }

        }
    );

} else {

    mic.disabled = true;

    mic.title =
        "Reconhecimento de voz não suportado neste navegador";
}


/* =====================================
   BOAS-VINDAS
===================================== */

setTimeout(() => {

    speak(
        "Sistemas online. Olá. Como posso ajudá-lo?"
    );

}, 900);

</script>

</body>
</html>
